{% extends 'base.html' %}
{% load static %}

{% block content %}
<link rel="stylesheet" href="{% static 'css/mypage.css' %}">

<div class="mypage-container">
    <div class="user-profile-header">
        <div class="avatar-circle">
            {{ user.username|slice:":1"|upper }}
        </div>
    </div>

    <div class="user-info-list">
        <div class="info-row">
            <span class="info-label">이름</span>
            <span class="info-value">{{ user.username }}</span>
        </div>
        <div class="info-row">
            <span class="info-label">이메일</span>
            <span class="info-value">{{ user.email|default:"이메일 정보 없음" }}</span>
        </div>
        <div class="info-row">
            <span class="info-label">가입일</span>
            <span class="info-value">{{ user.date_joined|date:"Y-m-d" }}</span>
        </div>
    </div>

    <div style="padding: 15px 0; display: flex; justify-content: space-between; align-items: center;">
        <span style="color: #ff4757;">로그아웃</span>
        <a href="{% url 'account_logout' %}"><i class="fa-solid fa-right-from-bracket" style="color: #ff4757;"></i></a>
    </div>
</div>
{% endblock %}
