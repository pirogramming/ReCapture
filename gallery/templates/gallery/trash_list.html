{% extends 'base.html' %}

{% load static %} {% block content %}
<h2>🗑️ 휴지통</h2>
<p>휴지통에 있는 사진은 30일 뒤에 영구 삭제됩니다.</p>
<a href="{% url 'gallery:photo_list' %}">← 갤러리로 돌아가기</a>

<div class="trash-grid" style="display: flex; flex-wrap: wrap; gap: 15px; margin-top: 20px;">
    {% for photo in photos %}
        <div class="photo-card" style="border: 1px solid #ddd; padding: 10px; opacity: 0.7;">
            <img src="{{ photo.image.url }}" style="width: 150px; height: 150px; object-fit: cover; filter: grayscale(100%);">
            <div style="margin-top: 10px;">
                <button onclick="restorePhoto({{ photo.id }}, '{{ csrf_token }}')" style="color: blue;">복구</button>
                <button onclick="permanentDelete({{ photo.id }}, '{{ csrf_token }}')" style="color: red;">영구 삭제</button>
            </div>
        </div>
    {% empty %}
        <p>휴지통이 비어 있습니다.</p>
    {% endfor %}
</div>

<script src="{% static 'gallery/js/trash_list.js' %}"></script>
{% endblock %}
